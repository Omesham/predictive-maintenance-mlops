
name: Python CI

# Run tests whenever development changes or a pull request targets main.
on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Test-only credentials. Never use production credentials here.
    env:
      PYTHONPATH: ".:src"
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: predictive_maintenance_test

    # Start PostgreSQL alongside the GitHub Actions runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: predictive_maintenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d predictive_maintenance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Download our repository.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Python.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Install project dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Create the engine_cycles table in the CI test database.
      - name: Initialize PostgreSQL schema
        run: |
          python - <<'PY'
          from pathlib import Path
          from database import getEngine

          engine = getEngine()
          try:
              with engine.begin() as connection:
                  connection.exec_driver_sql(Path("sql/schema.sql").read_text(encoding="utf-8"))
          finally:
              engine.dispose()
          PY

      # Run backend unit and integration tests.
      - name: Run backend tests
        run: python -m pytest tests/backend/ -v

      # Run existing project tests.
      - name: Run existing tests
        run: python -m pytest tests/ --ignore=tests/backend -v